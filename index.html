
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SHOTTAS AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#scene {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  height: 100dvh !important;
  margin: 0 !important;
  padding: 0 !important;
  display: block !important;
}

#status {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  z-index: 100;
  padding: 12px;
  border-radius: 9px;
  background: rgba(0,0,0,.78);
  color: white;
  font-size: 13px;
  line-height: 1.4;
  pointer-events: none;
}

#sound {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 101;
  border: 0;
  border-radius: 10px;
  background: #f5cb48;
  color: #111;
  padding: 14px 18px;
  font-weight: bold;
  white-space: nowrap;
}

.mindar-ui-overlay {
  z-index: 20;
}
</style>
</head>

<body>

<div id="status">Starting SHOTTAS AR...</div>
<button id="sound" type="button">Enable Sound</button>

<a-scene
  id="scene"
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;"
  color-space="sRGB"
  renderer="colorManagement: true; antialias: true; alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  embedded>

  <a-assets timeout="30000">
    <video
      id="arVideo"
      src="./shottas.mp4"
      preload="auto"
      playsinline
      webkit-playsinline
      muted
      loop
      crossorigin="anonymous">
    </video>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <a-video
      src="#arVideo"
      position="0 0 0.01"
      width="1"
      height="0.5625">
    </a-video>

  </a-entity>
</a-scene>

<script>
const scene = document.getElementById("scene");
const target = document.getElementById("target");
const video = document.getElementById("arVideo");
const sound = document.getElementById("sound");
const statusBox = document.getElementById("status");

let soundEnabled = false;
let tracking = false;

function show(message) {
  statusBox.textContent = message;
  console.log("[SHOTTAS AR]", message);
}

function diagnostics() {
  const canvas = scene.querySelector("canvas");

  const screenSize =
    window.innerWidth + "x" + window.innerHeight;

  const canvasSize = canvas
    ? canvas.clientWidth + "x" + canvas.clientHeight
    : "not ready";

  return "Screen: " + screenSize +
         " | Canvas: " + canvasSize;
}

function resizeAR() {
  if (!scene.renderer || !scene.camera) return;

  const width = window.innerWidth;
  const height = window.innerHeight;

  scene.style.width = width + "px";
  scene.style.height = height + "px";

  const canvas = scene.renderer.domElement;

  if (canvas) {
    canvas.style.width = "100%";
    canvas.style.height = "100%";
    canvas.style.display = "block";
  }

  show("AR display updated. " + diagnostics());
}

scene.addEventListener("loaded", () => {
  show("Scene loaded. Starting camera...");
});

scene.addEventListener("renderstart", () => {
  show("Renderer started. " + diagnostics());
});

scene.addEventListener("arReady", () => {
  show(
    "Camera ready! Point at SHOTTAS artwork. " +
    diagnostics()
  );
});

scene.addEventListener("arError", (event) => {
  show(
    "AR ERROR: " +
    String(event.detail?.error || "Camera/tracker failed")
  );
});

target.addEventListener("targetFound", async () => {
  tracking = true;

  show("SHOTTAS artwork recognized!");

  try {
    video.currentTime = 0;
    video.muted = !soundEnabled;
    await video.play();

    show("SHOTTAS animation playing!");
  } catch (error) {
    show("Video error: " + error.message);
  }
});

target.addEventListener("targetLost", () => {
  tracking = false;
  video.pause();
  video.currentTime = 0;

  show("Artwork lost. Point camera at SHOTTAS.");
});

sound.addEventListener("click", async () => {
  soundEnabled = true;
  video.muted = false;

  try {
    await video.play();

    if (!tracking) {
      video.pause();
      video.currentTime = 0;
    }

    sound.textContent = "Sound Enabled ✓";
    show("Sound enabled. Scan SHOTTAS artwork.");
  } catch (error) {
    show("Sound error: " + error.message);
  }
});

window.addEventListener("resize", () => {
  setTimeout(resizeAR, 150);
});

window.addEventListener("orientationchange", () => {
  setTimeout(resizeAR, 400);
});

window.addEventListener("error", (event) => {
  show("PAGE ERROR: " + event.message);
});

window.addEventListener("unhandledrejection", (event) => {
  show("STARTUP ERROR: " + String(event.reason));
});

setTimeout(() => {
  if (!tracking) {
    show("Waiting for artwork. " + diagnostics());
  }
}, 8000);
</script>

</body>
</html>
