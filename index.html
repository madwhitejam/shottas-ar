<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SHOTTAS AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
  }

  #status {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    z-index: 9999;
    color: white;
    background: rgba(0,0,0,.75);
    padding: 10px;
    border-radius: 6px;
    font: 13px Arial,sans-serif;
  }

  #sound {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    padding: 14px 20px;
    background: #f5cb48;
    border: none;
    border-radius: 9px;
    font-weight: bold;
  }
</style>
</head>

<body>

<div id="status">Starting SHOTTAS AR...</div>
<button id="sound">Enable Sound</button>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <video
      id="arVideo"
      src="./shottas.mp4"
      preload="metadata"
      crossorigin="anonymous"
      playsinline
      webkit-playsinline
      muted
      loop>
    </video>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <a-video
      src="#arVideo"
      position="0 0 0"
      width="1"
      height="0.5625">
    </a-video>

  </a-entity>

</a-scene>

<script>
const scene = document.querySelector("a-scene");
const target = document.querySelector("#target");
const video = document.querySelector("#arVideo");
const sound = document.querySelector("#sound");
const status = document.querySelector("#status");

let soundEnabled = false;
let tracking = false;

function show(message) {
  status.textContent = message;
  console.log(message);
}

scene.addEventListener("loaded", () => {
  show("Scene loaded. Starting camera...");
});

scene.addEventListener("arReady", () => {
  show("Camera ready. Point at SHOTTAS artwork.");
});

scene.addEventListener("arError", (event) => {
  show("AR error: " + JSON.stringify(event.detail || {}));
});

target.addEventListener("targetFound", async () => {
  tracking = true;
  show("Artwork recognized!");

  video.muted = !soundEnabled;

  try {
    video.currentTime = 0;
    await video.play();
    show("SHOTTAS animation playing!");
  } catch (error) {
    show("Playback error: " + error.message);
  }
});

target.addEventListener("targetLost", () => {
  tracking = false;
  video.pause();
  video.currentTime = 0;
  show("Artwork lost. Scan again.");
});

sound.addEventListener("click", async () => {
  soundEnabled = true;
  video.muted = false;

  try {
    await video.play();

    if (!tracking) {
      video.pause();
      video.currentTime = 0;
    }

    sound.textContent = "Sound Enabled ✓";
    show("Sound enabled. Point at SHOTTAS artwork.");
  } catch (error) {
    show("Sound error: " + error.message);
  }
});

window.addEventListener("error", (event) => {
  show("Page error: " + event.message);
});

window.addEventListener("unhandledrejection", (event) => {
  show("Startup error: " + String(event.reason));
});
</script>

</body>
</html>
