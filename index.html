<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Shottas AR</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><style>body{margin:0}#sound{position:fixed;z-index:99;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 14px;border:0;border-radius:8px;background:#222;color:white;font:14px sans-serif}</style></head><body><button id="sound">Tap to Enable Sound</button><video id="clip" src="./shottas.mp4" preload="auto" playsinline webkit-playsinline crossorigin="anonymous" style="display:none"></video><a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded><a-assets><video id="arVideo" src="./shottas.mp4" preload="auto" playsinline webkit-playsinline crossorigin="anonymous"></video></a-assets><a-camera position="0 0 0" look-controls="enabled: false"></a-camera><a-entity id="target" mindar-image-target="targetIndex: 0"><a-video src="#arVideo" position="0 0 0" width="1" height="0.55"></a-video></a-entity></a-scene><script>const video=document.getElementById('arVideo'),button=document.getElementById('sound'),target=document.getElementById('target');let soundEnabled=false;button.onclick=async()=>{soundEnabled=true;video.muted=false;try{await video.play();video.pause();video.currentTime=0;button.textContent='Sound Enabled ✓';setTimeout(()=>button.style.display='none',1200)}catch(e){button.textContent='Tap again to enable audio'}};target.addEventListener('targetFound',()=>{video.currentTime=0;video.muted=!soundEnabled;video.play().catch(()=>{button.style.display='block';button.textContent='Tap to Play with Sound'})});target.addEventListener('targetLost',()=>{video.pause();video.currentTime=0});</script></body></html>
