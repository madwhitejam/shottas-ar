<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHOTTAS AR</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.136.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

#ar-container {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: transparent;
}

#ar-container video {
  object-fit: cover;
}

#status {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  padding: 12px 18px;
  background: rgba(0,0,0,.75);
  color: white;
  border-radius: 12px;
  font-size: 14px;
  text-align: center;
  max-width: 90%;
  pointer-events: none;
}

#start {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  padding: 16px 35px;
  border: 0;
  border-radius: 30px;
  background: #e2b650;
  color: black;
  font-size: 18px;
  font-weight: bold;
}

#animation {
  display: none;
}

</style>
</head>

<body>

<div id="ar-container"></div>
<div id="status">SHOTTAS AR ready</div>
<button id="start">START CAMERA</button>

<video
  id="animation"
  src="./animation.mp4"
  preload="auto"
  playsinline
  webkit-playsinline
  muted
  loop>
</video>

<script>
const statusBox = document.getElementById("status");
const startButton = document.getElementById("start");
const video = document.getElementById("animation");
const container = document.getElementById("ar-container");

function status(message) {
  statusBox.textContent = message;
}

let started = false;

startButton.addEventListener("click", async () => {
  if (started) return;

  started = true;
  startButton.style.display = "none";

  try {
    status("Loading SHOTTAS AR...");

    const mindarThree = new window.MINDAR.IMAGE.MindARThree({
      container: container,
      imageTargetSrc: "./targets.mind",
      maxTrack: 1,
      filterMinCF: 0.0001,
      filterBeta: 0.001
    });

    const {
      renderer,
      scene,
      camera
    } = mindarThree;

    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    const anchor = mindarThree.addAnchor(0);

    const geometry = new THREE.PlaneGeometry(1, 1);

    const texture = new THREE.VideoTexture(video);
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;
    texture.format = THREE.RGBAFormat;

    const material = new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      opacity: 1,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const plane = new THREE.Mesh(geometry, material);

    // Position relative to the tracked printed artwork.
    plane.position.set(-0.08, -0.12, 0.02);

    // Match the animation's aspect ratio.
    function updateAspect() {
      if (video.videoWidth && video.videoHeight) {
        plane.scale.set(
          video.videoWidth / video.videoHeight,
          1,
          1
        );
      }
    }

    video.addEventListener("loadedmetadata", updateAspect);

    anchor.group.add(plane);
    plane.visible = false;

    anchor.onTargetFound = async () => {
      status("SHOTTAS detected!");
      plane.visible = true;

      try {
        video.currentTime = 0;
        await video.play();
      } catch (error) {
        status("Tap screen to play animation");
      }
    };

    anchor.onTargetLost = () => {
      plane.visible = false;
      video.pause();
      status("Point camera at SHOTTAS artwork");
    };

    status("Starting camera...");
    await mindarThree.start();

    // Ensure renderer is transparent.
    renderer.setClearColor(0x000000, 0);

    status("Camera active - scan SHOTTAS artwork");

    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
    });

  } catch (error) {
    console.error(error);
    status("ERROR: " + error.message);
    startButton.style.display = "block";
    startButton.textContent = "RETRY CAMERA";
    started = false;
  }
});

</script>

</body>
</html>
