<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>SHOTTAS AR - V14</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

/* MAIN AR CONTAINER */
#ar-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* A-FRAME SCENE */
#scene {
  width: 100%;
  height: 100%;
}

/* CAMERA ALIGNMENT - VERSION 14 */
/* Camera moves 15% LEFT and 15% DOWN */
#ar-container video:not(#arVideo) {
  translate: -15% 15%;
}

/* STATUS DISPLAY */
#status {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  z-index: 9999;
  background: rgba(0,0,0,0.75);
  color: white;
  padding: 10px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.4;
  pointer-events: none;
}

/* SOUND BUTTON */
#sound {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  background: #f5cb48;
  color: #111;
  border: none;
  border-radius: 9px;
  padding: 14px 20px;
  font-weight: bold;
  white-space: nowrap;
}
</style>
</head>

<body>

<div id="ar-container">

<a-scene
  id="scene"
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets timeout="30000">
    <video
      id="arVideo"
      src="./shottas.mp4"
      preload="metadata"
      crossorigin="anonymous"
      playsinline
      webkit-playsinline
      muted
      loop>
    </video>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <a-video
      src="#arVideo"
      position="0 0 0.01"
      width="1"
      height="0.5625">
    </a-video>

  </a-entity>

</a-scene>

</div>

<div id="status">
  SHOTTAS AR V14 - Initializing...
</div>

<button id="sound" type="button">
  Enable Sound
</button>

<script>
const scene = document.getElementById("scene");
const target = document.getElementById("target");
const video = document.getElementById("arVideo");
const sound = document.getElementById("sound");
const statusBox = document.getElementById("status");
const container = document.getElementById("ar-container");

let tracking = false;
let soundEnabled = false;

function show(message) {
  statusBox.textContent = message;
  console.log("[SHOTTAS V14]", message);
}

/* CAMERA ALIGNMENT */
function alignCamera() {
  const cameraVideos = [
    ...document.querySelectorAll("video")
  ].filter(v => v.id !== "arVideo");

  cameraVideos.forEach(v => {
    if (!container.contains(v)) {
      console.log("Camera outside AR container:", v);
    }

    v.style.translate = "-15% 15%";
  });
}

/* DIAGNOSTICS */
function diagnostics() {
  const canvas = scene.querySelector("canvas");

  const cameras = [
    ...document.querySelectorAll("video")
  ].filter(v => v.id !== "arVideo");

  const cameraInfo = cameras.map(v => {
    const r = v.getBoundingClientRect();

    return (
      "Camera: " +
      Math.round(r.x) + "," +
      Math.round(r.y) + " " +
      Math.round(r.width) + "x" +
      Math.round(r.height)
    );
  }).join(" | ");

  return (
    "Screen: " +
    window.innerWidth + "x" + window.innerHeight +
    " | Canvas: " +
    (canvas
      ? canvas.clientWidth + "x" + canvas.clientHeight
      : "not ready") +
    " | " +
    (cameraInfo || "Camera not found")
  );
}

/* SCENE EVENTS */
scene.addEventListener("loaded", () => {
  show("Scene loaded. Starting camera...");
});

scene.addEventListener("arReady", () => {
  alignCamera();

  show(
    "Camera ready. " + diagnostics()
  );
});

scene.addEventListener("arError", event => {
  show(
    "AR error: " +
    JSON.stringify(event.detail || {})
  );
});

/* ARTWORK TRACKING */
target.addEventListener("targetFound", async () => {
  tracking = true;
  show("SHOTTAS artwork recognized!");

  video.muted = !soundEnabled;

  try {
    video.currentTime = 0;
    await video.play();
    show("SHOTTAS animation playing!");
  } catch (error) {
    show("Playback error: " + error.message);
  }
});

target.addEventListener("targetLost", () => {
  tracking = false;
  video.pause();
  video.currentTime = 0;

  show("Artwork lost. Scan SHOTTAS again.");
});

/* SOUND BUTTON */
sound.addEventListener("click", async () => {
  soundEnabled = true;
  video.muted = false;

  try {
    await video.play();

    if (!tracking) {
      video.pause();
      video.currentTime = 0;
    }

    sound.textContent = "Sound Enabled ✓";
    show("Sound enabled. Scan SHOTTAS artwork.");
  } catch (error) {
    show("Sound error: " + error.message);
  }
});

/* RESIZE */
window.addEventListener("resize", () => {
  alignCamera();
});

/* ERROR REPORTING */
window.addEventListener("error", event => {
  show("Page error: " + event.message);
});

window.addEventListener("unhandledrejection", event => {
  show("Startup error: " + String(event.reason));
});
</script>

</body>
</html>
