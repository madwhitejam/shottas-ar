<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>SHOTTAS AR - V16</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

/* MAIN AR CONTAINER */
#ar-container {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

/* A-FRAME SCENE */
#scene {
  width: 100%;
  height: 100%;
}

/* STATUS DISPLAY */
#status {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  z-index: 9999;
  background: rgba(0,0,0,0.8);
  color: white;
  padding: 10px;
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  pointer-events: none;
}

/* SOUND BUTTON */
#sound {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  background: #f5cb48;
  color: #111;
  border: none;
  border-radius: 9px;
  padding: 14px 20px;
  font-weight: bold;
  white-space: nowrap;
}
</style>
</head>

<body>

<div id="ar-container">

<a-scene
  id="scene"
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets timeout="30000">
    <video
      id="arVideo"
      src="./shottas.mp4"
      preload="metadata"
      crossorigin="anonymous"
      playsinline
      webkit-playsinline
      muted
      loop>
    </video>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <a-video
      src="#arVideo"
      position="0 0 0.01"
      width="1"
      height="0.5625">
    </a-video>

  </a-entity>

</a-scene>

</div>

<div id="status">
  SHOTTAS V16 - Initializing...
</div>

<button id="sound" type="button">
  Enable Sound
</button>

<script>
const scene = document.getElementById("scene");
const target = document.getElementById("target");
const video = document.getElementById("arVideo");
const sound = document.getElementById("sound");
const statusBox = document.getElementById("status");

let tracking = false;
let soundEnabled = false;

/* STATUS */
function show(message) {
  statusBox.textContent = message;
  console.log("[SHOTTAS V16]", message);
}

/* CAMERA ALIGNMENT */
function alignCamera() {
  const camera = [...document.querySelectorAll("video")]
    .find(v => v.id !== "arVideo");

  if (!camera) {
    show("Camera element not found.");
    return;
  }

  camera.style.setProperty("position", "fixed", "important");
  camera.style.setProperty("left", "0px", "important");
  camera.style.setProperty("top", "0px", "important");
  camera.style.setProperty("width", "100vw", "important");
  camera.style.setProperty("height", "100vh", "important");
  camera.style.setProperty("object-fit", "cover", "important");
  camera.style.setProperty("transform", "none", "important");
  camera.style.setProperty("translate", "none", "important");
  camera.style.setProperty("margin", "0", "important");
  camera.style.setProperty("z-index", "0", "important");

  const canvas = scene.querySelector("canvas");

  if (canvas) {
    canvas.style.setProperty("position", "absolute", "important");
    canvas.style.setProperty("left", "0px", "important");
    canvas.style.setProperty("top", "0px", "important");
    canvas.style.setProperty("z-index", "1", "important");
    canvas.style.setProperty("background", "transparent", "important");
  }

  show("Camera aligned. " + diagnostics());
}

/* DIAGNOSTICS */
function diagnostics() {
  const camera = [...document.querySelectorAll("video")]
    .find(v => v.id !== "arVideo");

  if (!camera) {
    return "Camera element unavailable.";
  }

  const r = camera.getBoundingClientRect();

  return (
    "Screen: " +
    window.innerWidth + "x" + window.innerHeight +
    " | Camera: " +
    Math.round(r.x) + "," +
    Math.round(r.y) + " " +
    Math.round(r.width) + "x" +
    Math.round(r.height)
  );
}

/* SCENE EVENTS */
scene.addEventListener("loaded", () => {
  show("Scene loaded. Starting camera...");
});

scene.addEventListener("arReady", () => {
  show("Camera ready. Aligning display...");

  setTimeout(alignCamera, 500);
});

scene.addEventListener("arError", event => {
  show(
    "AR error: " +
    JSON.stringify(event.detail || {})
  );
});

/* ARTWORK TRACKING */
target.addEventListener("targetFound", async () => {
  tracking = true;
  show("SHOTTAS artwork recognized!");

  video.muted = !soundEnabled;

  try {
    video.currentTime = 0;
    await video.play();
    show("SHOTTAS animation playing!");
  } catch (error) {
    show("Playback error: " + error.message);
  }
});

target.addEventListener("targetLost", () => {
  tracking = false;
  video.pause();
  video.currentTime = 0;
  show("Artwork lost. Scan again.");
});

/* SOUND CONTROL */
sound.addEventListener("click", async () => {
  soundEnabled = true;
  video.muted = false;

  try {
    await video.play();

    if (!tracking) {
      video.pause();
      video.currentTime = 0;
    }

    sound.textContent = "Sound Enabled ✓";
    show("Sound enabled. Scan SHOTTAS artwork.");
  } catch (error) {
    show("Sound error: " + error.message);
  }
});

/* ERROR REPORTING */
window.addEventListener("error", event => {
  show("Page error: " + event.message);
});

window.addEventListener("unhandledrejection", event => {
  show("Startup error: " + String(event.reason));
});
</script>

</body>
</html>
