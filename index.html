<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHOTTAS AR - V21</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      background: black;
      font-family: Arial, sans-serif;
    }

    #message {
      position: fixed;
      top: 15px;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 1px 5px black;
    }

    #soundButton {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 15px 25px;
      font-size: 17px;
      border: none;
      border-radius: 30px;
      background: #ffffff;
      color: #111111;
      cursor: pointer;
    }

    #version {
      position: fixed;
      top: 45px;
      width: 100%;
      text-align: center;
      color: #f5cb48;
      font-size: 12px;
      z-index: 20;
      pointer-events: none;
    }
  </style>

  <script>
    // Adjusts only the artwork video texture.
    // Does not modify the camera or tracker.

    AFRAME.registerComponent('video-cover', {
      schema: {
        video: {type: 'selector'},
        frameAspect: {default: 1.654}
      },

      init: function () {
        const el = this.el;
        const video = this.data.video;
        const aspect = this.data.frameAspect;

        const texture = new THREE.VideoTexture(video);

        texture.colorSpace =
          THREE.SRGBColorSpace || texture.colorSpace;

        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;

        const material = new THREE.MeshBasicMaterial({
          map: texture,
          side: THREE.DoubleSide
        });

        const geometry = new THREE.PlaneGeometry(
          1,
          1 / aspect
        );

        const mesh = new THREE.Mesh(geometry, material);
        el.setObject3D('mesh', mesh);

        function updateCrop() {
          const videoAspect =
            (video.videoWidth && video.videoHeight)
              ? video.videoWidth / video.videoHeight
              : 1080 / 2316;

          // Fill the frame without stretching.
          // Crop excess video around the center.

          let repeatX = 1;
          let repeatY = 1;

          if (videoAspect > aspect) {
            repeatX = aspect / videoAspect;
          } else {
            repeatY = videoAspect / aspect;
          }

          texture.repeat.set(repeatX, repeatY);

          texture.offset.set(
            (1 - repeatX) / 2,
            (1 - repeatY) / 2
          );

          texture.needsUpdate = true;
        }

        video.addEventListener(
          'loadedmetadata',
          updateCrop
        );

        updateCrop();

        this.remove = function () {
          video.removeEventListener(
            'loadedmetadata',
            updateCrop
          );

          el.removeObject3D('mesh');
          geometry.dispose();
          material.dispose();
          texture.dispose();
        };
      }
    });
  </script>
</head>

<body>

  <div id="message">
    Point your camera at the SHOTTAS artwork
  </div>

  <div id="version">
    SHOTTAS V21 - EDGE TO EDGE
  </div>

  <button id="soundButton">
    Tap to Enable Sound
  </button>

  <!-- Working Paul Campbell camera setup unchanged -->

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="artVideo"
        src="./shottas.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline>
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Estimated artwork frame: 923 x 558 -->
      <!-- Video is cropped to fill the frame -->

      <a-entity
        video-cover="video: #artVideo; frameAspect: 1.654"
        position="0 0 0.01">
      </a-entity>

    </a-entity>

  </a-scene>

  <script>
    const video = document.querySelector('#artVideo');

    const target = document.querySelector(
      '[mindar-image-target]'
    );

    const message = document.querySelector('#message');

    const soundButton = document.querySelector(
      '#soundButton'
    );

    let soundEnabled = false;
    let artworkVisible = false;

    soundButton.addEventListener('click', async () => {
      try {
        video.muted = false;
        video.volume = 1;

        await video.play();

        soundEnabled = true;
        soundButton.style.display = 'none';

        if (!artworkVisible) {
          video.pause();
          video.currentTime = 0;
        }
      } catch (error) {
        message.textContent =
          'Sound could not start. Tap again.';

        console.warn(error);
      }
    });

    target.addEventListener('targetFound', () => {
      artworkVisible = true;

      message.textContent =
        'SHOTTAS artwork recognized!';

      video.currentTime = 0;

      if (!soundEnabled) {
        video.muted = true;
      }

      video.play().catch(console.warn);
    });

    target.addEventListener('targetLost', () => {
      artworkVisible = false;

      video.pause();

      message.textContent =
        'Point your camera at the SHOTTAS artwork';
    });
  </script>

</body>
</html>
