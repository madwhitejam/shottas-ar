
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>SHOTTAS AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

/* CAMERA STACKING TEST */
video:not(#arVideo) {
  z-index: -1;
}

/* STATUS MESSAGE */
#status {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  z-index: 9999;
  color: white;
  background: rgba(0,0,0,.75);
  padding: 10px;
  border-radius: 6px;
  font: 13px Arial,sans-serif;
}

/* SOUND BUTTON */
#sound {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  padding: 14px 20px;
  background: #f5cb48;
  color: black;
  border: none;
  border-radius: 9px;
  font-weight: bold;
  white-space: nowrap;
}
</style>
</head>

<body>

<div id="status">
  Starting SHOTTAS AR...
</div>

<button id="sound" type="button">
  Enable Sound
</button>

<a-scene
  id="scene"
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets timeout="30000">
    <video
      id="arVideo"
      src="./shottas.mp4"
      preload="metadata"
      crossorigin="anonymous"
      playsinline
      webkit-playsinline
      muted
      loop>
    </video>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <a-video
      src="#arVideo"
      position="0 0 0.01"
      width="1"
      height="0.5625">
    </a-video>

  </a-entity>

</a-scene>

<script>
const scene = document.getElementById("scene");
const target = document.getElementById("target");
const video = document.getElementById("arVideo");
const sound = document.getElementById("sound");
const statusBox = document.getElementById("status");

let soundEnabled = false;
let tracking = false;

function show(message) {
  statusBox.textContent = message;
  console.log("[SHOTTAS AR]", message);
}

/* SCENE STATUS */

scene.addEventListener("loaded", () => {
  show("Scene loaded. Starting camera...");
});

scene.addEventListener("arReady", () => {
  show("Camera ready. Point at SHOTTAS artwork.");
});

scene.addEventListener("arError", (event) => {
  show(
    "AR error: " +
    JSON.stringify(event.detail || {})
  );
});

/* ARTWORK TRACKING */

target.addEventListener("targetFound", async () => {
  tracking = true;
  show("SHOTTAS artwork recognized!");

  video.muted = !soundEnabled;

  try {
    video.currentTime = 0;
    await video.play();
    show("SHOTTAS animation playing!");
  } catch (error) {
    show("Playback error: " + error.message);
  }
});

target.addEventListener("targetLost", () => {
  tracking = false;
  video.pause();
  video.currentTime = 0;
  show("Artwork lost. Scan again.");
});

/* SOUND CONTROL */

sound.addEventListener("click", async () => {
  soundEnabled = true;
  video.muted = false;

  try {
    await video.play();

    if (!tracking) {
      video.pause();
      video.currentTime = 0;
    }

    sound.textContent = "Sound Enabled ✓";
    show("Sound enabled. Scan SHOTTAS artwork.");
  } catch (error) {
    show("Sound error: " + error.message);
  }
});

/* ERROR REPORTING */

window.addEventListener("error", (event) => {
  show("Page error: " + event.message);
});

window.addEventListener("unhandledrejection", (event) => {
  show("Startup error: " + String(event.reason));
});
</script>

</body>
</html>
